<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0a1f44,#6f4c83);
color:white;
overflow:hidden;
}

/* BLOBS (same design) */
.blob{
position:absolute;
border-radius:50%;
filter:blur(90px);
opacity:0.5;
animation:move 12s infinite ease-in-out alternate;
}

.blob1{
width:300px;
height:300px;
background:#ffd700;
top:10%;
left:10%;
}

.blob2{
width:250px;
height:250px;
background:#00c3ff;
top:60%;
left:70%;
animation-delay:2s;
}

@keyframes move{
0%{transform:translate(0,0);}
100%{transform:translate(40px,-40px);}
}

/* NAVBAR */
header{
display:flex;
justify-content:space-between;
padding:25px 80px;
position:relative;
z-index:2;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:30px;
}

nav ul li a{
color:white;
text-decoration:none;
}

nav ul li a:hover{
color:#ffd700;
}

/* SECTION */
.contact{
padding:60px 20px;
position:relative;
z-index:2;
}

.title{
font-size:40px;
margin-bottom:30px;
}

/* CARD */
.card{
max-width:600px;
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:20px;
backdrop-filter:blur(15px);
box-shadow:0 10px 30px rgba(0,0,0,0.4);
transition:0.4s;
}

.card:hover{
transform:translateY(-10px);
background:rgba(255,255,255,0.15);
}

/* LINKS */
.contact a{
display:block;
margin:10px 0;
color:#ffd700;
text-decoration:none;
font-size:16px;
transition:0.3s;
}

.contact a:hover{
color:white;
text-decoration:underline;
}
</style>
</head>

<body>
